<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Finora — Keuangan Pribadi</title>
  <meta name="description" content="Finora: pencatat keuangan pribadi — transaksi, rekening, utang/piutang, anggaran, laporan." />
  <meta name="theme-color" content="#6FAE8F" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- ===== LOGIN ===== -->
  <section id="loginView" class="login" hidden>
    <div class="login-box">
      <div class="logo">🌿</div>
      <h1>Finora</h1>
      <p class="sub">Masuk dengan PIN</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off"
             maxlength="8" placeholder="••••" aria-label="PIN" />
      <button id="btnLogin" class="btn primary">Masuk</button>
      <p id="loginError" class="error" hidden></p>
      <p class="tiny" id="apiHint"></p>
      <a class="tiny link" href="#/set">Atur Web App URL →</a>
    </div>
  </section>

  <!-- ===== APP ===== -->
  <div id="app" hidden>
    <header class="appbar">
      <div class="brand"><span>🌿</span> Finora</div>
      <div class="appbar-right">
        <span id="offlineChip" class="chip offline" hidden>📴 Offline</span>
        <button id="btnMore" class="ib" title="Menu lainnya">⚙️</button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="bottomnav" aria-label="Navigasi utama">
      <button data-go="dash" class="bn active"><span>🏠</span><em>Beranda</em></button>
      <button data-go="tx" class="bn"><span>💸</span><em>Transaksi</em></button>
      <button data-go="acc" class="bn"><span>🏦</span><em>Rekening</em></button>
      <button data-go="debt" class="bn"><span>🤝</span><em>Utang</em></button>
      <button data-go="rep" class="bn"><span>📊</span><em>Laporan</em></button>
    </nav>
  </div>

  <!-- ===== MODAL ===== -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">Judul</h3>
        <button id="modalClose" class="ib">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="fab" hidden><button id="fabBtn" class="fab">＋</button></div>

  <script src="./js/app.js"></script>
</body>
</html>
